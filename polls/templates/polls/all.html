<h1>Tous les sondages</h1>

<ul>
{% for question in all_questions %}
    <li>
        <strong>ID : {{ question.id }}</strong> —
        <a href="{% url 'polls:frequency' question.id %}">
            {{ question.question_text }}
        </a>
    </li>
{% empty %}
    <li>Aucun sondage n'est disponible pour le moment.</li>
{% endfor %}
</ul>

<hr>
<a href="{% url 'polls:index' %}">Retour à l'accueil</a>
